name: Test Source Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync latest Facebook Plus release to Feather source
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SOURCE_REPO: ttlongdl/feather
          SOURCE_FILE: personal-source.json
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::Missing SOURCE_REPO_TOKEN"; exit 1; }

          RELEASE_JSON="$(gh api repos/ttlongdl/Facebook-IPA-Patcher/releases/latest)"
          RELEASE_TAG="$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')"
          RELEASE_DATE="$(printf '%s' "$RELEASE_JSON" | jq -r '.published_at')"
          RELEASE_BODY="$(printf '%s' "$RELEASE_JSON" | jq -r '.body // ""')"
          ASSET_NAME="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".ipa")) | .name' | head -1)"
          ASSET_URL="$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .browser_download_url')"
          ASSET_SIZE="$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .size')"
          FB_VERSION="$(printf '%s' "$ASSET_NAME" | sed -E 's/^FB\.([0-9.]+)\.Plus\.v.*\.ipa$/\1/')"
          PLUS_VERSION="$(printf '%s' "$ASSET_NAME" | sed -E 's/^FB\.[0-9.]+\.Plus\.v(.*)\.ipa$/\1/')"

          test -n "$ASSET_URL"; test "$ASSET_URL" != "null"
          WORK="$(mktemp -d)"
          gh api "repos/$SOURCE_REPO/contents/$SOURCE_FILE?ref=main" --jq '.content' | tr -d '\n' | base64 --decode > "$WORK/source.json"

          jq --arg version "$FB_VERSION" --arg plus "$PLUS_VERSION" --arg date "$RELEASE_DATE" --argjson size "$ASSET_SIZE" --arg url "$ASSET_URL" --arg notes "$RELEASE_BODY" '
            (.apps[] | select(.bundleIdentifier == "com.facebook.Facebook")) as $app |
            $app.subtitle = ("Facebook " + $version + " · FBPlus v" + $plus) |
            $app.localizedDescription = $notes |
            $app.version = $version |
            $app.versionDate = $date |
            $app.size = $size |
            $app.downloadURL = $url |
            $app.versions = ([{
              version: $version, date: $date, size: $size, downloadURL: $url,
              localizedDescription: ("Facebook " + $version + " with Facebook Plus v" + $plus + ".")
            }] + (($app.versions // []) | map(select(.version != $version))))
          ' "$WORK/source.json" > "$WORK/source.updated.json"

          SHA="$(gh api "repos/$SOURCE_REPO/contents/$SOURCE_FILE?ref=main" --jq '.sha')"
          CONTENT="$(base64 < "$WORK/source.updated.json" | tr -d '\n')"
          gh api --method PUT "repos/$SOURCE_REPO/contents/$SOURCE_FILE" -f message="Test source sync from $RELEASE_TAG" -f content="$CONTENT" -f sha="$SHA" -f branch=main
          echo "SUCCESS: synced $RELEASE_TAG -> Facebook $FB_VERSION + FBPlus v$PLUS_VERSION"
