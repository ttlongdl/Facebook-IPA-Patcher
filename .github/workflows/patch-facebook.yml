name: Build Facebook Plus IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct download URL to a clean Facebook IPA"
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install cyan / pyzule-rw
        run: |
          set -euo pipefail
          brew install ldid dpkg
          command -v dpkg-deb
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          cyan --help >/dev/null

      - name: Download clean Facebook IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p input
          curl --fail --location --retry 3 --retry-delay 2 "$IPA_URL" -o input/Facebook-clean.ipa
          unzip -tq input/Facebook-clean.ipa >/dev/null
          echo "INPUT_IPA=$PWD/input/Facebook-clean.ipa" >> "$GITHUB_ENV"

      - name: Download latest Facebook Plus rootfull release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          RELEASE="$(gh release view --repo ttlongdl/Facebook-Plus --json tagName,assets)"
          TAG="$(jq -er '.tagName' <<< "$RELEASE")"
          VERSION="${TAG#v}"
          ASSET="Facebook-Plus-v${VERSION}-rootfull.deb"
          if ! jq -e --arg asset "$ASSET" '[.assets[].name] | index($asset) != null' <<< "$RELEASE" >/dev/null; then
            echo "::error::Latest Facebook-Plus release $TAG has no $ASSET. Publish its rootfull DEB before patching an IPA."
            exit 1
          fi
          echo "Using Facebook Plus $TAG ($ASSET)"
          gh release download "$TAG" --repo ttlongdl/Facebook-Plus \
            --pattern "$ASSET" --dir assets
          test -s "assets/$ASSET"
          ACTUAL_VERSION="$(dpkg-deb -f "assets/$ASSET" Version)"
          ACTUAL_ARCH="$(dpkg-deb -f "assets/$ASSET" Architecture)"
          echo "DEB metadata: Version=$ACTUAL_VERSION Architecture=$ACTUAL_ARCH"
          if [ "$ACTUAL_VERSION" != "$VERSION" ]; then
            echo "::error::Release $TAG disagrees with rootfull DEB Version $ACTUAL_VERSION"
            exit 1
          fi
          mv "assets/$ASSET" assets/FacebookPlus-rootfull.deb
          echo "PLUS_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download latest Rootless ShopeeBlocker dylib
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          release="$(gh api 'repos/ttlongdl/ShopeeBlocker/releases?per_page=100' | jq -er '
            [.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) and
                ([.assets[]?.name] | index("ShopeeBlocker.dylib") != null))]
            | first // error("No Rootless ShopeeBlocker release with dylib asset")
          ')"
          tag="$(jq -r '.tag_name' <<< "$release")"
          test -n "$tag"
          echo "Using Rootless ShopeeBlocker release: $tag"
          gh release download "$tag" --repo ttlongdl/ShopeeBlocker \
            --pattern 'ShopeeBlocker.dylib' --dir assets
          test -s assets/ShopeeBlocker.dylib
          echo "SHOPEE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Unpack Safari extension asset
        run: |
          set -euo pipefail
          rm -rf assets/safari
          mkdir -p assets/safari
          EXT_ZIP="OpenInFacebookSafariExtension-Add Deeplink.zip"
          test -f "$EXT_ZIP"
          rm -rf "$RUNNER_TEMP/safari-extension"
          mkdir -p "$RUNNER_TEMP/safari-extension"
          unzip -q "$EXT_ZIP" -d "$RUNNER_TEMP/safari-extension"
          APPEX="$(find "$RUNNER_TEMP/safari-extension" -type d -name 'OpenInFacebookSafariExtension.appex' -print -quit)"
          test -n "$APPEX"
          ditto "$APPEX" assets/safari/OpenInFacebookSafariExtension.appex
          test -f assets/safari/OpenInFacebookSafariExtension.appex/Info.plist

      - name: Patch and verify IPA
        run: |
          set -euo pipefail
          chmod +x scripts/patch.sh
          scripts/patch.sh "$INPUT_IPA"

      - name: Resolve output
        run: |
          set -euo pipefail
          OUT="$(find "$PWD" -maxdepth 1 -type f -name "FB * Plus v$PLUS_VERSION.ipa" -print -quit)"
          test -n "$OUT"
          BASENAME="$(basename "$OUT")"
          VERSION="${BASENAME#FB }"
          VERSION="${VERSION% Plus v$PLUS_VERSION.ipa}"
          echo "OUTPUT_IPA=$OUT" >> "$GITHUB_ENV"
          echo "FB_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PLUS_VERSION=$PLUS_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=fb-$VERSION-plus-v$PLUS_VERSION-shopee-v$SHOPEE_VERSION-build-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FB-${{ env.FB_VERSION }}-Plus-v${{ env.PLUS_VERSION }}
          path: ${{ env.OUTPUT_IPA }}
          retention-days: 7
          compression-level: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Facebook $FB_VERSION patched with Facebook Plus v$PLUS_VERSION and ShopeeBlocker v$SHOPEE_VERSION, libroot-free cyan injection, fbbridge deep-link support, UISupportedDevices cleanup, Facebook extension stripping (only Open in Facebook Safari extension retained), and TrollFools backup cleanup."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$OUTPUT_IPA" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "FB $FB_VERSION Plus v$PLUS_VERSION" \
              --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" "$OUTPUT_IPA" \
              --title "FB $FB_VERSION Plus v$PLUS_VERSION" \
              --notes "$NOTES"
          fi
