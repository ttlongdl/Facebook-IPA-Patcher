name: Patch Facebook IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the clean TrollDecrypt IPA"
        required: false
        default: "fb-579-test"
        type: string
      ipa_url:
        description: "Optional direct IPA URL; release_tag is preferred"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install insert_dylib
        run: brew install insert_dylib

      - name: Unpack pinned golden assets
        run: |
          rm -rf assets
          unzip -q golden-assets.zip
          test -f assets/FacebookPlus.dylib
          test -d assets/FacebookPlus.bundle
          test -f assets/FBAudioFix-v0.3.14.dylib
          test -d assets/OpenInFacebookSafariExtension.appex

      - name: Get clean IPA
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_URL: ${{ inputs.ipa_url }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p input
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            gh release download "$RELEASE_TAG" --pattern '*.ipa' --dir input
            echo "TARGET_RELEASE=$RELEASE_TAG" >> "$GITHUB_ENV"
          elif [ -n "$IPA_URL" ]; then
            curl -fL "$IPA_URL" -o input/Facebook-clean.ipa
          else
            test -n "$RELEASE_TAG"
            gh release download "$RELEASE_TAG" --pattern '*.ipa' --dir input
            echo "TARGET_RELEASE=$RELEASE_TAG" >> "$GITHUB_ENV"
          fi
          IPA="$(find input -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          echo "INPUT_IPA=$IPA" >> "$GITHUB_ENV"

      - name: Patch IPA
        run: |
          chmod +x scripts/patch.sh
          scripts/patch.sh "$INPUT_IPA"
          OUT="$(find "$PWD" -maxdepth 1 -type f -name 'Facebook-*-Plus-DeepLink-AudioFix.ipa' -print -quit)"
          test -n "$OUT"
          echo "OUTPUT_IPA=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Facebook-IPA
          path: ${{ env.OUTPUT_IPA }}
          compression-level: 0

      - name: Attach patched IPA to release
        if: env.TARGET_RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TARGET_RELEASE" "$OUTPUT_IPA" --clobber
