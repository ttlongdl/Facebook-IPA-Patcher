name: Build Facebook Plus Plus IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct download URL to a clean Facebook IPA"
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install cyan / pyzule-rw
        run: |
          set -euo pipefail
          brew install ldid
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          cyan --help >/dev/null

      - name: Download clean Facebook IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p input
          curl --fail --location --retry 3 --retry-delay 2 "$IPA_URL" -o input/Facebook-clean.ipa
          unzip -tq input/Facebook-clean.ipa >/dev/null
          echo "INPUT_IPA=$PWD/input/Facebook-clean.ipa" >> "$GITHUB_ENV"

      - name: Download Facebook Plus rootfull v1.0.1-4
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download v1.0.1-4 \
            --repo ttlongdl/Facebook-Plus \
            --pattern "Facebook-Plus-v1.0.1-4-rootfull.deb" \
            --dir assets
          mv assets/Facebook-Plus-v1.0.1-4-rootfull.deb assets/FacebookPlus-rootfull.deb
          test -s assets/FacebookPlus-rootfull.deb

      - name: Unpack Safari extension asset
        run: |
          set -euo pipefail
          rm -rf assets/safari
          mkdir -p assets/safari
          EXT_ZIP="OpenInFacebookSafariExtension-Add Deeplink.zip"
          test -f "$EXT_ZIP"
          rm -rf "$RUNNER_TEMP/safari-extension"
          mkdir -p "$RUNNER_TEMP/safari-extension"
          unzip -q "$EXT_ZIP" -d "$RUNNER_TEMP/safari-extension"
          APPEX="$(find "$RUNNER_TEMP/safari-extension" -type d -name 'OpenInFacebookSafariExtension.appex' -print -quit)"
          test -n "$APPEX"
          ditto "$APPEX" assets/safari/OpenInFacebookSafariExtension.appex
          test -f assets/safari/OpenInFacebookSafariExtension.appex/Info.plist

      - name: Patch and verify IPA
        run: |
          set -euo pipefail
          chmod +x scripts/patch.sh
          scripts/patch.sh "$INPUT_IPA"

      - name: Resolve output
        run: |
          set -euo pipefail
          OUT="$(find "$PWD" -maxdepth 1 -type f -name 'FB * Plus Plus.ipa' -print -quit)"
          test -n "$OUT"
          VERSION="$(basename "$OUT" | sed -E 's/^FB (.+) Plus Plus\.ipa$/\1/')"
          echo "OUTPUT_IPA=$OUT" >> "$GITHUB_ENV"
          echo "FB_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=fb-$VERSION-plus-plus" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FB-${{ env.FB_VERSION }}-Plus-Plus
          path: ${{ env.OUTPUT_IPA }}
          compression-level: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Facebook $FB_VERSION patched with Facebook Plus v1.0.1-4, libroot-free cyan injection, fbbridge deep-link support, UISupportedDevices cleanup, Facebook extension stripping (only Open in Facebook Safari extension retained), and TrollFools backup cleanup."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$OUTPUT_IPA" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "FB $FB_VERSION Plus Plus" \
              --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" "$OUTPUT_IPA" \
              --title "FB $FB_VERSION Plus Plus" \
              --notes "$NOTES"
          fi
