name: Build Facebook Plus Triple-Tweak IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct URL to your own decrypted Facebook IPA'
        required: true
        type: string
      bundle_id:
        description: 'Optional custom app bundle identifier'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: patcher-triple-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      THEOS: ${{ github.workspace }}/theos
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout patcher
        uses: actions/checkout@v4

      - name: Checkout latest published Facebook Plus release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api repos/ttlongdl/Facebook-Plus/releases/latest --jq '.tag_name')"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "::error::Invalid FBPlus release tag: $TAG"; exit 1; }
          git clone --quiet --recursive https://github.com/ttlongdl/Facebook-Plus.git fbplus
          cd fbplus
          git checkout --detach "$TAG"
          git submodule update --init --recursive
          VERSION="$(awk -F': ' '/^Version:/{print $2; exit}' control)"
          test "$TAG" = "v$VERSION" || { echo "::error::Release tag $TAG disagrees with control Version $VERSION"; exit 1; }
          echo "PLUS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Using FBPlus release $TAG at $(git rev-parse --short HEAD)"

      - name: Download source IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$IPA_URL"
          mkdir -p fbplus/test
          http_code=$(curl --fail --location --silent --show-error --write-out '%{http_code}' "$IPA_URL" -o fbplus/test/com.facebook.Facebook.ipa)
          echo "Download HTTP status: $http_code"
          echo "Downloaded bytes: $(wc -c < fbplus/test/com.facebook.Facebook.ipa)"
          if ! unzip -tq fbplus/test/com.facebook.Facebook.ipa >/dev/null; then
            echo "::error::Downloaded file is not a valid ZIP/IPA archive"
            exit 1
          fi
          if ! unzip -Z1 fbplus/test/com.facebook.Facebook.ipa | grep -E '^Payload/[^/]+[.]app/Info[.]plist$'; then
            echo "::error::ZIP is valid but Payload app Info.plist is missing"
            exit 1
          fi

      - name: Install build tools
        run: |
          brew install ldid dpkg xz
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Build FBPlus Rootless DEB (no automatic injection)
        run: |
          set -euo pipefail
          mv fbplus/test/com.facebook.Facebook.ipa "$RUNNER_TEMP/source-facebook.ipa"
          cd fbplus
          SCHEMES=rootless ./build.sh
          cd ..
          test "$(dpkg-deb -f "fbplus/packages/Facebook-Plus-v${PLUS_VERSION}-rootless.deb" Version)" = "$PLUS_VERSION"
          mv "$RUNNER_TEMP/source-facebook.ipa" fbplus/test/com.facebook.Facebook.ipa
          test -n "$(find fbplus/packages -maxdepth 1 -name '*rootless.deb' -print -quit)"

      - name: Build standalone FBAudioFix and ShopeeBlocker
        run: |
          set -euo pipefail
          mkdir -p standalone
          # Pin the experimental audio logic explicitly; never silently fall back to main.
          AUDIO_REF="0.3.21-experimental"
          git clone --quiet --depth 1 --branch "$AUDIO_REF" https://github.com/ttlongdl/FBAudioFix.git standalone/FBAudioFix
          AUDIO_VERSION="$(awk -F': ' '/^Version:/{print $2; exit}' standalone/FBAudioFix/control)"
          test "$AUDIO_VERSION" = "0.3.21" || { echo "::error::Expected FBAudioFix 0.3.21, got $AUDIO_VERSION"; exit 1; }
          echo "FBAudioFix ref=$AUDIO_REF commit=$(git -C standalone/FBAudioFix rev-parse HEAD) version=$AUDIO_VERSION"
          git clone --quiet --depth 1 https://github.com/ttlongdl/ShopeeBlocker.git standalone/ShopeeBlocker
          for repo in FBAudioFix ShopeeBlocker; do
            make -C "standalone/${repo}" clean
            make -C "standalone/${repo}" package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
            find "standalone/${repo}/packages" -maxdepth 1 -name '*.deb' -print
          done
          shopt -s nullglob
          audio_debs=(standalone/FBAudioFix/packages/*.deb)
          (( ${#audio_debs[@]} == 1 )) || { echo "::error::Expected exactly one FBAudioFix DEB"; exit 1; }
          test "$(dpkg-deb -f "${audio_debs[0]}" Version)" = "$AUDIO_VERSION" || { echo "::error::Audio DEB version mismatch"; exit 1; }

      - name: Build Safari extensions and merge icon metadata
        run: |
          set -euo pipefail
          mkdir -p fbplus/staging
          shopt -s nullglob
          plugins=()
          for mk in fbplus/OpenInFacebookSafariExtension/*/Makefile; do
            ext_dir="$(dirname "$mk")"
            make -C "$ext_dir" FINALPACKAGE=1
            for candidate in "$ext_dir"/.theos/obj/*.appex; do
              if [[ -f "$candidate/Info.plist" ]]; then plugins+=("$candidate"); fi
            done
          done
          (( ${#plugins[@]} > 0 )) || { echo "::error::No Safari extension was built"; exit 1; }
          printf '%s\n' "${plugins[@]}" > fbplus/staging/extensions.txt
          logos=(fbplus/resources/logo/fbplus_*.png)
          if (( ${#logos[@]} > 0 )); then
            python3 fbplus/scripts/icon_plist.py fbplus/test/com.facebook.Facebook.ipa fbplus/staging/icon-merge.plist
          fi

      - name: Inject three DEBs and Safari extension
        env:
          CUSTOM_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          fb=(fbplus/packages/*rootless.deb)
          audio=(standalone/FBAudioFix/packages/*.deb)
          shopee=(standalone/ShopeeBlocker/packages/*.deb)
          (( ${#fb[@]} == 1 && ${#audio[@]} == 1 && ${#shopee[@]} == 1 )) || exit 1
          plugins=()
          while IFS= read -r path; do plugins+=("$path"); done < fbplus/staging/extensions.txt
          logos=(fbplus/resources/logo/fbplus_*.png)
          extras=()
          if [[ -f fbplus/staging/icon-merge.plist ]]; then extras+=(-l fbplus/staging/icon-merge.plist); fi
          if [[ -n "$CUSTOM_BUNDLE_ID" ]]; then extras+=(-b "$CUSTOM_BUNDLE_ID"); fi
          cyan -i fbplus/test/com.facebook.Facebook.ipa -o fbplus/staging/Facebook-Triple-Tweak-UNSIGNED.ipa \
            -f "${fb[0]}" "${audio[0]}" "${shopee[0]}" \
            "${logos[@]}" "${plugins[@]}" "${extras[@]}" -uwsgq
          # Patch the main app Info.plist after cyan injection, before signing.
          # Files exposes only Documents, not the entire Facebook sandbox.
          python3 - <<'PY'
          import os
          import plistlib
          import tempfile
          import zipfile

          ipa = "fbplus/staging/Facebook-Triple-Tweak-UNSIGNED.ipa"
          fd, temporary = tempfile.mkstemp(suffix=".ipa", dir=os.path.dirname(ipa))
          os.close(fd)
          try:
              with zipfile.ZipFile(ipa, "r") as source, zipfile.ZipFile(temporary, "w") as output:
                  plist_paths = [
                      name for name in source.namelist()
                      if name.startswith("Payload/")
                      and name.count("/") == 2
                      and name.endswith(".app/Info.plist")
                  ]
                  if len(plist_paths) != 1:
                      raise RuntimeError(f"Expected one main app Info.plist, got: {plist_paths}")
                  target = plist_paths[0]
                  for entry in source.infolist():
                      contents = source.read(entry.filename)
                      if entry.filename == target:
                          info = plistlib.loads(contents)
                          info["UIFileSharingEnabled"] = True
                          info["LSSupportsOpeningDocumentsInPlace"] = True
                          contents = plistlib.dumps(info, fmt=plistlib.FMT_BINARY)
                      output.writestr(entry, contents)
              os.replace(temporary, ipa)
          finally:
              if os.path.exists(temporary):
                  os.unlink(temporary)

          with zipfile.ZipFile(ipa) as archive:
              info = plistlib.loads(archive.read(target))
              for key in ("UIFileSharingEnabled", "LSSupportsOpeningDocumentsInPlace"):
                  if info.get(key) is not True:
                      raise RuntimeError(f"{key} is not enabled")
                  print(f"Verified {key}=true in {target}")
          PY
          unzip -tq fbplus/staging/Facebook-Triple-Tweak-UNSIGNED.ipa >/dev/null
          FB_VERSION="$(python3 fbplus/scripts/ipa_version.py fbplus/test/com.facebook.Facebook.ipa)"
          test -n "$FB_VERSION"
          IPA_NAME="FB ${FB_VERSION} Plus v${PLUS_VERSION} (Triple-Tweak).ipa"
          mv fbplus/staging/Facebook-Triple-Tweak-UNSIGNED.ipa "fbplus/staging/$IPA_NAME"
          unzip -tq "fbplus/staging/$IPA_NAME" >/dev/null
          echo "FB_VERSION=$FB_VERSION" >> "$GITHUB_ENV"
          echo "IPA_OUTPUT=$PWD/fbplus/staging/$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload verified IPA and standalone DEBs
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Plus-Triple-Tweak
          path: |
            fbplus/staging/*.ipa
            fbplus/packages/*rootless.deb
            standalone/FBAudioFix/packages/*.deb
            standalone/ShopeeBlocker/packages/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Publish versioned IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$FB_VERSION"
          test -s "$IPA_OUTPUT"
          TAG="fb-${FB_VERSION}-plus-v${PLUS_VERSION}-triple-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$IPA_OUTPUT" --repo "${GITHUB_REPOSITORY}" \
            --title "FB ${FB_VERSION} Plus v${PLUS_VERSION} (Triple-Tweak)" \
            --notes "Facebook Plus v${PLUS_VERSION}, FBAudioFix 0.3.21-experimental (built from source), standalone ShopeeBlocker, plus Open in Facebook Safari extension. Generated from user-supplied decrypted IPA. Sign the resulting IPA yourself."
