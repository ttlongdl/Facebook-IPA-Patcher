name: Patch Facebook IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to clean TrollDecrypt IPA (optional if release asset triggers workflow)"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install insert_dylib
        run: brew install insert_dylib

      - name: Get clean IPA
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            gh release download "${{ github.event.release.tag_name }}" --pattern '*.ipa' --dir input
          else
            test -n "$IPA_URL"
            mkdir -p input
            curl -fL "$IPA_URL" -o input/Facebook-clean.ipa
          fi
          IPA="$(find input -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          echo "INPUT_IPA=$IPA" >> "$GITHUB_ENV"

      - name: Patch IPA
        run: |
          chmod +x scripts/patch.sh
          scripts/patch.sh "$INPUT_IPA"
          OUT="$(find "$PWD" -maxdepth 1 -type f -name 'Facebook-*-Plus-DeepLink-AudioFix.ipa' -print -quit)"
          test -n "$OUT"
          echo "OUTPUT_IPA=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Facebook-IPA
          path: ${{ env.OUTPUT_IPA }}
          compression-level: 0

      - name: Attach patched IPA to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$OUTPUT_IPA" --clobber
