name: Build Facebook Plus Triple-Tweak IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct URL to your own decrypted Facebook IPA'
        required: true
        type: string
      bundle_id:
        description: 'Optional custom app bundle identifier'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: patcher-triple-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      THEOS: ${{ github.workspace }}/theos
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout patcher
        uses: actions/checkout@v4

      - name: Checkout Facebook Plus release source
        run: |
          set -euo pipefail
          git clone --quiet --recursive https://github.com/ttlongdl/Facebook-Plus.git fbplus
          cd fbplus
          git checkout --detach 84f314d6dc87afbeb493fb768402d850a2ed2eaa
          VERSION="$(awk -F': ' '/^Version:/{print $2; exit}' control)"
          test "$VERSION" = "1.0.2-2" || { echo "::error::Expected Facebook Plus 1.0.2-2, got $VERSION"; exit 1; }
          echo "PLUS_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download source IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$IPA_URL"
          mkdir -p fbplus/test
          http_code=$(curl --fail --location --silent --show-error --write-out '%{http_code}' "$IPA_URL" -o fbplus/test/com.facebook.Facebook.ipa)
          echo "Download HTTP status: $http_code"
          echo "Downloaded bytes: $(wc -c < fbplus/test/com.facebook.Facebook.ipa)"
          if ! unzip -tq fbplus/test/com.facebook.Facebook.ipa >/dev/null; then
            echo "::error::Downloaded file is not a valid ZIP/IPA archive"
            exit 1
          fi
          if ! unzip -Z1 fbplus/test/com.facebook.Facebook.ipa | grep -E '^Payload/[^/]+[.]app/Info[.]plist$'; then
            echo "::error::ZIP is valid but Payload app Info.plist is missing"
            exit 1
          fi

      - name: Install build tools
        run: |
          brew install ldid dpkg xz
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Build FBPlus Rootless DEB (no automatic injection)
        run: |
          set -euo pipefail
          mv fbplus/test/com.facebook.Facebook.ipa "$RUNNER_TEMP/source-facebook.ipa"
          cd fbplus
          SCHEMES=rootless ./build.sh
          cd ..
          test "$(dpkg-deb -f "fbplus/packages/Facebook-Plus-v${PLUS_VERSION}-rootless.deb" Version)" = "$PLUS_VERSION"
          mv "$RUNNER_TEMP/source-facebook.ipa" fbplus/test/com.facebook.Facebook.ipa
          test -n "$(find fbplus/packages -maxdepth 1 -name '*rootless.deb' -print -quit)"

      - name: Build standalone FBAudioFix and ShopeeBlocker
        run: |
          set -euo pipefail
          mkdir -p standalone
          for repo in FBAudioFix ShopeeBlocker; do
            git clone --depth 1 "https://github.com/ttlongdl/${repo}.git" "standalone/${repo}"
            make -C "standalone/${repo}" clean
            make -C "standalone/${repo}" package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
            find "standalone/${repo}/packages" -maxdepth 1 -name '*.deb' -print
          done

      - name: Build Safari extensions and merge icon metadata
        run: |
          set -euo pipefail
          mkdir -p fbplus/staging
          shopt -s nullglob
          plugins=()
          for mk in fbplus/OpenInFacebookSafariExtension/*/Makefile; do
            ext_dir="$(dirname "$mk")"
            make -C "$ext_dir" FINALPACKAGE=1
            for candidate in "$ext_dir"/.theos/obj/*.appex; do
              if [[ -f "$candidate/Info.plist" ]]; then plugins+=("$candidate"); fi
            done
          done
          (( ${#plugins[@]} > 0 )) || { echo "::error::No Safari extension was built"; exit 1; }
          printf '%s\n' "${plugins[@]}" > fbplus/staging/extensions.txt
          logos=(fbplus/resources/logo/fbplus_*.png)
          if (( ${#logos[@]} > 0 )); then
            python3 fbplus/scripts/icon_plist.py fbplus/test/com.facebook.Facebook.ipa fbplus/staging/icon-merge.plist
          fi

      - name: Inject three DEBs and Safari extension
        env:
          CUSTOM_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          fb=(fbplus/packages/*rootless.deb)
          audio=(standalone/FBAudioFix/packages/*.deb)
          shopee=(standalone/ShopeeBlocker/packages/*.deb)
          (( ${#fb[@]} == 1 && ${#audio[@]} == 1 && ${#shopee[@]} == 1 )) || exit 1
          plugins=()
          while IFS= read -r path; do plugins+=("$path"); done < fbplus/staging/extensions.txt
          logos=(fbplus/resources/logo/fbplus_*.png)
          extras=()
          if [[ -f fbplus/staging/icon-merge.plist ]]; then extras+=(-l fbplus/staging/icon-merge.plist); fi
          if [[ -n "$CUSTOM_BUNDLE_ID" ]]; then extras+=(-b "$CUSTOM_BUNDLE_ID"); fi
          cyan -i fbplus/test/com.facebook.Facebook.ipa -o fbplus/staging/Facebook-Triple-Tweak-UNSIGNED.ipa \
            -f "${fb[0]}" "${audio[0]}" "${shopee[0]}" \
            "${logos[@]}" "${plugins[@]}" "${extras[@]}" -uwsgq
          unzip -tq fbplus/staging/Facebook-Triple-Tweak-UNSIGNED.ipa >/dev/null
          echo "IPA_OUTPUT=$PWD/fbplus/staging/Facebook-Triple-Tweak-UNSIGNED.ipa" >> "$GITHUB_ENV"

      - name: Upload verified IPA and standalone DEBs
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Triple-Tweak-v1.0.2-2
          path: |
            fbplus/staging/Facebook-Triple-Tweak-UNSIGNED.ipa
            fbplus/packages/*rootless.deb
            standalone/FBAudioFix/packages/*.deb
            standalone/ShopeeBlocker/packages/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Publish versioned IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FB_VERSION="$(python3 fbplus/scripts/ipa_version.py fbplus/test/com.facebook.Facebook.ipa)"
          test -n "$FB_VERSION"
          TAG="fb-${FB_VERSION}-plus-v${PLUS_VERSION}-triple-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$IPA_OUTPUT" --repo "${GITHUB_REPOSITORY}" \
            --title "FB ${FB_VERSION} Plus v${PLUS_VERSION} (Triple-Tweak)" \
            --notes "Facebook Plus v${PLUS_VERSION}, standalone FBAudioFix and ShopeeBlocker, plus Open in Facebook Safari extension. Generated from user-supplied decrypted IPA. Sign the resulting IPA yourself."
